<!doctype html>
<!-- Title cards for the demo video (docs/VIDEO-SCRIPT.md): the opening (0:00–0:20) and the close
     (2:50–3:00). Not part of the product. Open this file in a browser, go full screen, and record.
     Space or → plays the next beat; R restarts; 1 jumps to the opening, 2 to the close. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Readback: video cards</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --ground: #0a1424; --surface: #111d33; --rule: #23324d; --ink: #f2f5fa; --muted: #9fb0c8; --accent: #6aa9ff; --refund: #ffb38a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--ground); color: var(--ink); font-family: "Plus Jakarta Sans", system-ui, sans-serif; cursor: none; }
  main { height: 100%; display: grid; place-items: center; padding: 6vmin; }
  section { display: none; width: min(1100px, 100%); }
  section.on { display: block; }

  .note { background: var(--surface); border: 1px solid var(--rule); border-radius: 20px; padding: 5vmin 6vmin; }
  .from { font: 500 2.2vmin "IBM Plex Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .amount { font: 800 9vmin/1.1 "Plus Jakarta Sans", sans-serif; margin: 2vmin 0 1vmin; min-height: 10vmin; }
  .claim { font: 600 5.2vmin/1.25 "Plus Jakarta Sans", sans-serif; color: var(--refund); min-height: 7vmin; }
  .caret::after { content: ""; display: inline-block; width: 0.08em; height: 0.9em; margin-left: 0.08em; background: currentColor; vertical-align: -0.08em; animation: blink 0.9s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .who { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.5vmin; margin-top: 4vmin; }
  .who div { border: 1px solid var(--rule); border-radius: 16px; padding: 3vmin; opacity: 0; transform: translateY(1.5vmin); transition: opacity 0.5s, transform 0.5s; }
  .who div.in { opacity: 1; transform: none; }
  .who b { display: block; font: 800 3.4vmin "Plus Jakarta Sans", sans-serif; }
  .who span { display: block; margin-top: 1vmin; font: 400 2.4vmin/1.35 "Plus Jakarta Sans", sans-serif; color: var(--muted); }

  .close { text-align: center; }
  .mark { color: var(--accent); width: 14vmin; height: 14vmin; }
  .name { font: 800 11vmin/1 "Plus Jakarta Sans", sans-serif; margin: 2vmin 0 3vmin; }
  .line { font: 600 4vmin/1.3 "Plus Jakarta Sans", sans-serif; }
  .sub { margin-top: 3vmin; font: 500 2.4vmin "IBM Plex Mono", monospace; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .who div { transition: none; } .caret::after { animation: none; } }
</style>
</head>
<body>
<main>
  <section id="open" aria-label="Opening card">
    <div class="note">
      <div class="from">Dispute · reason given by the buyer</div>
      <div class="amount" id="amount"></div>
      <div class="claim" id="claim"></div>
    </div>
    <div class="who">
      <div><b>Maya</b><span>What did I let my agent buy?</span></div>
      <div><b>The store</b><span>Did her agent really ask for this?</span></div>
      <div><b>PayPal's investigator</b><span>Nothing on record says.</span></div>
    </div>
  </section>

  <section id="close" class="close" aria-label="Closing card">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
    <div class="name">Readback</div>
    <div class="line">The safe way to let your AI shop with PayPal.</div>
    <div class="sub">PayPal sandbox demo · an independent hackathon project, not a PayPal product</div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  let run = 0; // bumping this cancels a typing run in progress

  async function type(el, text, perChar, mine) {
    el.textContent = ""; el.classList.add("caret");
    for (const ch of text) { if (mine !== run) return; el.textContent += ch; await sleep(perChar); }
    el.classList.remove("caret");
  }

  // Beat 1 types the card (about 5 s). Beats 2–4 bring in one caption each, to follow the voiceover.
  let beat = 0;
  const captions = () => [...document.querySelectorAll(".who div")];
  function reset() { run++; beat = 0; $("amount").textContent = ""; $("claim").textContent = ""; captions().forEach((d) => d.classList.remove("in")); }
  function show(id) { reset(); for (const s of document.querySelectorAll("section")) s.classList.toggle("on", s.id === id); }

  async function next() {
    if (!$("open").classList.contains("on")) return show("open");
    beat++;
    if (beat === 1) { const mine = ++run; await type($("amount"), "$64.99", 90, mine); await sleep(350); await type($("claim"), "“I didn't buy this. My AI did.”", 75, mine); }
    else if (beat <= 4) captions()[beat - 2].classList.add("in");
    else show("close");
  }

  addEventListener("keydown", (e) => {
    if (e.key === " " || e.key === "ArrowRight") { e.preventDefault(); next(); }
    else if (e.key === "r" || e.key === "R") show("open");
    else if (e.key === "1") show("open");
    else if (e.key === "2") show("close");
  });
  show("open");
</script>
</body>
</html>
