# Render Blueprint: two stateless Starter services (always on during judging; no disk, no database).
# Secrets are set in the Render dashboard (sync: false), never in this file. Steps: docs/DEPLOY.md.
# PayPal's return URLs use RENDER_EXTERNAL_URL, which Render sets on web services (apps/web/lib/agreements.ts).
# pnpm comes from npx at the pinned version, because Node 25+ no longer ships Corepack, and the services
# start their binaries directly, so nothing at runtime depends on a package manager.
services:
  - type: web
    name: readback-web
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npx --yes pnpm@12.11.2 install --frozen-lockfile && npx --yes pnpm@12.11.2 --filter @readback/web build
    startCommand: cd apps/web && ./node_modules/.bin/next start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.18.0"
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: ANTHROPIC_DAILY_CALLS
        value: "500"
      - key: MERCHANT_ADMIN_TOKEN
        sync: false
      - key: AGENT_RUNTIME_URL # the agent service's public https URL
        sync: false
      - key: HERO_AGREEMENT_ID
        sync: false
      - key: JUDGE_AGREEMENT_ID
        sync: false
      - key: HERO_CASE_ID # the home page's live pair: her signed charge and the twist charge (capture IDs)
        sync: false
      - key: TWIST_CASE_ID
        sync: false
      - key: DEMO_MODE
        value: "true"

  - type: web
    name: readback-agent
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npx --yes pnpm@12.11.2 install --frozen-lockfile
    startCommand: cd apps/agent && node src/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.18.0"
      - key: AGENT_PRIVATE_KEY # the same value as apps/agent/.env; never in apps/web
        sync: false
      - key: MERCHANT_URL
        sync: false
      - key: HERO_MCP_SECRET
        sync: false
      - key: JUDGE_MCP_SECRET
        sync: false
      - key: HERO_AGREEMENT_ID
        sync: false
      - key: JUDGE_AGREEMENT_ID
        sync: false
